services:
  - type: web
    name: try-oh
    runtime: node
    region: singapore
    plan: free
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24.22.2"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: PERSISTENCE_BACKEND
        value: postgres
      - key: AUTH_BACKEND
        value: supabase
      - key: IMAGE_STORAGE
        value: supabase
      - key: SUPABASE_STORAGE_BUCKET
        value: tryoh-private
      - key: SUPABASE_STORAGE_PREFIX
        value: production
      # Functional prototype first; a real AI provider needs its own backend key.
      - key: IMAGE_PROVIDER
        value: mock
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: AI_MAX_CONCURRENCY
        value: "1"
      - key: AI_MAX_WAITING_REQUESTS
        value: "4"
      - key: AI_DAILY_REQUEST_LIMIT
        value: "100"
      - key: MOBILE_AUTH_REDIRECT_URLS
        value: tryoh://auth-callback
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      # Optional Google, AI, R2 and payment keys are added directly to Environment.
      # They are not required to deploy the mock prototype.
