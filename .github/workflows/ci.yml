name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-api:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - name: Install browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/tryoh-browser" --no-save --package-lock=false playwright@1.65.0
          "$RUNNER_TEMP/tryoh-browser/node_modules/.bin/playwright" install --with-deps chromium
      - run: npm run smoke -- --browser
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/tryoh-browser/node_modules/playwright/index.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: tryoh-web-api
          path: |
            dist/
            dist-server/
            package.json
            package-lock.json
            supabase/migrations/
            test-results/
          retention-days: 7

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npx expo config --type public --json > /tmp/tryoh-expo-config.json
      - run: npx expo export --platform ios --output-dir dist-ios
      - run: npx expo export --platform android --output-dir dist-android
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tryoh-mobile-js-bundles
          path: |
            mobile/dist-ios/
            mobile/dist-android/
          retention-days: 7

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [web-api, mobile]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: docker build -t tryoh:ci .
      - name: Boot isolated mock prototype
        run: |
          docker run -d --rm --name tryoh-ci -p 127.0.0.1:8787:8787 \
            -e ALLOW_LOCAL_BACKENDS=true -e IMAGE_PROVIDER=mock \
            -e PERSISTENCE_BACKEND=sqlite -e AUTH_BACKEND=local \
            -e IMAGE_STORAGE=local -e COOKIE_SECURE=false tryoh:ci
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 --max-time 5 --retry-max-time 120 http://127.0.0.1:8787/api/health
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs tryoh-ci || true
          docker stop tryoh-ci || true

  research-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 experiments/benchmark_fashn.py --manifest benchmarks/cases.example.json --dry-run
